name: MLflow CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12.7"
  MLFLOW_VERSION: "2.19.0"
  IMAGE_REPOSITORY: workflow-ci-vicky-ferdinand-samuel

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mlflow==${{ env.MLFLOW_VERSION }} \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            matplotlib==3.9.2 \
            seaborn==0.13.2 \
            xgboost==2.1.3

      - name: Validate environment
        run: |
          python --version
          python - <<'PY'
          import sys
          import mlflow
          import numpy
          import pandas
          import sklearn
          import xgboost

          assert sys.version_info[:3] == (3, 12, 7), sys.version
          assert mlflow.__version__ == "2.19.0", mlflow.__version__
          print("mlflow", mlflow.__version__)
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("sklearn", sklearn.__version__)
          print("xgboost", xgboost.__version__)
          PY

      - name: Run MLflow Project
        id: mlflow_run
        working-directory: MLProject
        run: |
          set +e
          mlflow run . --env-manager=local --experiment-name="Credit Risk Prediction - Baseline"
          RUN_STATUS=$?
          echo "status=$RUN_STATUS" >> "$GITHUB_OUTPUT"
          echo "MLFLOW_RUN_STATUS=$RUN_STATUS" >> "$GITHUB_ENV"
          set -e
          exit "$RUN_STATUS"

      - name: Upload MLflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-artifacts
          path: |
            MLProject/artifacts/
            MLProject/mlruns/
          if-no-files-found: error

      - name: Build Docker image
        env:
          CONDA_PLUGINS_AUTO_ACCEPT_TOS: "yes"
        run: |
          find MLProject/mlruns -name "conda.yaml" -exec sed -i '/- defaults/d' {} +
          MODEL_DIR=$(realpath $(dirname $(find MLProject/mlruns -name "MLmodel" | head -n 1)))
          if [ -z "$MODEL_DIR" ]; then
            echo "Model directory not found in mlruns!"
            exit 1
          fi
          echo "Found model at $MODEL_DIR"
          mlflow models build-docker -m "$MODEL_DIR" -n "local/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}" --env-manager=conda

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets['DOCKER_USERNAME'] }}
          password: ${{ secrets['DOCKER_PASSWORD'] }}

      - name: Tag Docker image
        env:
          DOCKER_IMAGE_OWNER: ${{ secrets['DOCKER_USERNAME'] }}
        run: |
          docker tag local/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }} "$DOCKER_IMAGE_OWNER/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}"
          docker tag local/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }} "$DOCKER_IMAGE_OWNER/${{ env.IMAGE_REPOSITORY }}:latest"

      - name: Push Docker image
        env:
          DOCKER_IMAGE_OWNER: ${{ secrets['DOCKER_USERNAME'] }}
        run: |
          docker push "$DOCKER_IMAGE_OWNER/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}"
          docker push "$DOCKER_IMAGE_OWNER/${{ env.IMAGE_REPOSITORY }}:latest"
